name: Publish to Registries

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main

jobs:
  get-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: versioning
        run: |
          # Extract base version from python manifest as source of truth
          BASE_VERSION=$(grep "^version =" bindings/python/pyproject.toml | cut -d '"' -f 2 | cut -d '-' -f 1)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            if [[ $GITHUB_BASE_REF == main ]]; then
              VERSION="$BASE_VERSION-rc.$GITHUB_RUN_NUMBER"
            else
              VERSION="$BASE_VERSION-dev.$GITHUB_RUN_NUMBER"
            fi
          else
            VERSION="$BASE_VERSION-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "Calculated Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-core:
    name: Build Go Core Shared Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            filename: libomniql.so
          - os: macos-latest
            goos: darwin
            goarch: amd64
            filename: libomniql.dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            filename: omniql.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build Shared Library
        run: |
          go build -buildmode=c-shared -o ${{ matrix.filename }} pkg/ffi/ffi.go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}
          path: ${{ matrix.filename }}

  publish-pypi:
    name: Publish Python Wheels to PyPI
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.get-version.outputs.version }}\"/" bindings/python/pyproject.toml
      - name: Build and Publish Wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip build setuptools wheel twine
          cp core-artifacts/core-linux/libomniql.so bindings/python/omniql/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/python/omniql/
          cp core-artifacts/core-windows/omniql.dll bindings/python/omniql/
          cd bindings/python
          python -m build
          twine upload dist/*

  publish-npm:
    name: Publish npm Package
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          cd bindings/typescript
          npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version
      - name: Prepare npm Package
        run: |
          cd bindings/typescript
          npm install
          npm run build
          cp ../../core-artifacts/core-linux/libomniql.so dist/
          cp ../../core-artifacts/core-darwin/libomniql.dylib dist/
          cp ../../core-artifacts/core-windows/omniql.dll dist/
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm publish --access public

  publish-nuget:
    name: Publish .NET Package to NuGet
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          sed -i "s/<Version>.*<\/Version>/<Version>${{ needs.get-version.outputs.version }}<\/Version>/" bindings/csharp/OmniQL/OmniQL.csproj
      - name: Build and Publish
        run: |
          cd bindings/csharp/OmniQL
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/win-x64/native
          cp ../../../core-artifacts/core-linux/libomniql.so runtimes/linux-x64/native/
          cp ../../../core-artifacts/core-darwin/libomniql.dylib runtimes/osx-x64/native/
          cp ../../../core-artifacts/core-windows/omniql.dll runtimes/win-x64/native/
          dotnet build -c Release
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-maven:
    name: Publish Java Package to GitHub Packages
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/uttam-mahata/omniql</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server>
                <id>github</id>
                <username>Uttam-Mahata</username>
                <password>${{ secrets.PAT_GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          mvn -f bindings/java/pom.xml versions:set -DnewVersion=${{ needs.get-version.outputs.version }} -DgenerateBackupPoms=false
      - name: Prepare Native Libraries
        run: |
          mkdir -p bindings/java/src/main/resources/native
          cp core-artifacts/core-linux/libomniql.so bindings/java/src/main/resources/native/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/java/src/main/resources/native/
          cp core-artifacts/core-windows/omniql.dll bindings/java/src/main/resources/native/
      - name: Publish to GitHub Packages
        run: mvn -f bindings/java/pom.xml deploy -DskipTests --no-transfer-progress
