name: Publish to PyPI and npm

on:
  push:
    tags:
      - 'v*'

jobs:
  build-core:
    name: Build Go Core Shared Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            filename: libomniql.so
          - os: macos-latest
            goos: darwin
            goarch: amd64
            filename: libomniql.dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            filename: omniql.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build Shared Library
        run: |
          go build -buildmode=c-shared -o ${{ matrix.filename }} pkg/ffi/ffi.go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}
          path: ${{ matrix.filename }}

  publish-pypi:
    name: Publish Python Wheels to PyPI
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Build and Publish Wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip build setuptools wheel twine
          
          # Bundle all binaries for the "Fat Package" strategy
          cp core-artifacts/core-linux/libomniql.so bindings/python/omniql/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/python/omniql/
          cp core-artifacts/core-windows/omniql.dll bindings/python/omniql/
          
          cd bindings/python
          python -m build
          twine upload dist/*

  publish-npm:
    name: Publish npm Package
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Prepare npm Package
        run: |
          cd bindings/typescript
          npm install
          npm run build
          # Copy binaries to dist where the code expects them (relative to __dirname)
          cp ../../core-artifacts/core-linux/libomniql.so dist/
          cp ../../core-artifacts/core-darwin/libomniql.dylib dist/
          cp ../../core-artifacts/core-windows/omniql.dll dist/
        env:
          CXXFLAGS: "-fpermissive"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm publish --access public
