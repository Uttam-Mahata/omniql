name: Publish to Registries

# Trigger strategy:
#   RC       — push tag v*-rc.*     (e.g. v0.9.0-rc.1)
#   Stable   — push tag v*          (e.g. v0.9.0)
on:
  push:
    tags:
      - 'v*'
      - '!v*-beta.*'

jobs:
  get-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.versioning.outputs.version }}
      maven_version: ${{ steps.versioning.outputs.maven_version }}
      npm_tag:       ${{ steps.versioning.outputs.npm_tag }}
      release_type:  ${{ steps.versioning.outputs.release_type }}
    steps:
      - uses: actions/checkout@v4
      - id: versioning
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            if [[ $TAG == *-rc.* ]]; then
              VERSION=$TAG
              MAVEN_VERSION=$TAG
              RELEASE_TYPE="rc"
              NPM_TAG="next"
            else
              VERSION=$TAG
              MAVEN_VERSION=$TAG
              RELEASE_TYPE="stable"
              NPM_TAG="latest"
            fi
          else
            echo "Error: This workflow must be triggered by a version tag (v*)."
            exit 1
          fi

          echo "Release type : $RELEASE_TYPE"
          echo "Version      : $VERSION"
          echo "Maven version: $MAVEN_VERSION"
          echo "npm tag      : $NPM_TAG"
          echo "version=$VERSION"       >> $GITHUB_OUTPUT
          echo "maven_version=$MAVEN_VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG"       >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

  build-core:
    name: Build Go Core Shared Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            filename: libomniql.so
          - os: macos-latest
            goos: darwin
            goarch: amd64
            filename: libomniql.dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            filename: omniql.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build Shared Library
        run: |
          go build -buildmode=c-shared -o ${{ matrix.filename }} pkg/ffi/ffi.go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}
          path: ${{ matrix.filename }}

  publish-pypi:
    name: Publish Python Wheels to PyPI
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.get-version.outputs.version }}\"/" bindings/python/pyproject.toml
      - name: Build and Publish Wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip build setuptools wheel twine
          cp core-artifacts/core-linux/libomniql.so bindings/python/omniql/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/python/omniql/
          cp core-artifacts/core-windows/omniql.dll bindings/python/omniql/
          cd bindings/python
          python -m build
          twine upload dist/*

  publish-npm:
    name: Publish npm Package
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          cd bindings/typescript
          npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version
      - name: Prepare npm Package
        run: |
          cd bindings/typescript
          npm install
          npm run build
          cp ../../core-artifacts/core-linux/libomniql.so dist/
          cp ../../core-artifacts/core-darwin/libomniql.dylib dist/
          cp ../../core-artifacts/core-windows/omniql.dll dist/
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm publish --access public --tag ${{ needs.get-version.outputs.npm_tag }}

  publish-nuget:
    name: Publish .NET Package to NuGet
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          sed -i "s/<Version>.*<\/Version>/<Version>${{ needs.get-version.outputs.version }}<\/Version>/" bindings/csharp/OmniQL/OmniQL.csproj
      - name: Build and Publish
        run: |
          cd bindings/csharp/OmniQL
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/win-x64/native
          cp ../../../core-artifacts/core-linux/libomniql.so runtimes/linux-x64/native/
          cp ../../../core-artifacts/core-darwin/libomniql.dylib runtimes/osx-x64/native/
          cp ../../../core-artifacts/core-windows/omniql.dll runtimes/win-x64/native/
          dotnet build -c Release
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  goreleaser:
    name: GoReleaser — CLI Distribution
    # Only run GoReleaser on stable and rc tag pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs the full git history for changelogs.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  publish-maven:
    name: Publish Java Package to GitHub Packages
    # GitHub Packages Maven registry does not support SNAPSHOT (timestamped) PUT paths.
    # Only publish on tags (rc / stable).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-core, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>Uttam-Mahata</username>
                <password>${{ secrets.PAT_GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Set Version
        run: |
          mvn -f bindings/java/pom.xml versions:set -DnewVersion=${{ needs.get-version.outputs.maven_version }} -DgenerateBackupPoms=false
      - name: Prepare Native Libraries
        run: |
          mkdir -p bindings/java/src/main/resources/native
          cp core-artifacts/core-linux/libomniql.so bindings/java/src/main/resources/native/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/java/src/main/resources/native/
          cp core-artifacts/core-windows/omniql.dll bindings/java/src/main/resources/native/
      - name: Publish to GitHub Packages
        run: mvn -f bindings/java/pom.xml deploy -DskipTests -e
