name: Publish to Registries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-core:
    name: Build Go Core Shared Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            filename: libomniql.so
          - os: macos-latest
            goos: darwin
            goarch: amd64
            filename: libomniql.dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            filename: omniql.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build Shared Library
        run: |
          go build -buildmode=c-shared -o ${{ matrix.filename }} pkg/ffi/ffi.go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}
          path: ${{ matrix.filename }}

  publish-pypi:
    name: Publish Python Wheels to PyPI
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Build and Publish Wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip build setuptools wheel twine
          cp core-artifacts/core-linux/libomniql.so bindings/python/omniql/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/python/omniql/
          cp core-artifacts/core-windows/omniql.dll bindings/python/omniql/
          cd bindings/python
          python -m build
          twine upload dist/*

  publish-npm:
    name: Publish npm Package
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Prepare npm Package
        run: |
          cd bindings/typescript
          npm install
          npm run build
          cp ../../core-artifacts/core-linux/libomniql.so dist/
          cp ../../core-artifacts/core-darwin/libomniql.dylib dist/
          cp ../../core-artifacts/core-windows/omniql.dll dist/
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm publish --access public

  publish-maven:
    name: Publish Java Package to Maven Central
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: ossrh
          server-username: ${{ secrets.OSSRH_USERNAME }}
          server-password: ${{ secrets.OSSRH_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Build and Publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -p bindings/java/src/main/resources/native
          cp core-artifacts/core-linux/libomniql.so bindings/java/src/main/resources/native/
          cp core-artifacts/core-darwin/libomniql.dylib bindings/java/src/main/resources/native/
          cp core-artifacts/core-windows/omniql.dll bindings/java/src/main/resources/native/
          
          cd bindings/java
          # Generate settings.xml with the requested format
          cat <<EOF > settings.xml
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>\${env.OSSRH_USERNAME}</username>
                <password>\${env.OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          
          mvn clean deploy -P release -DskipTests -s settings.xml -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }} --batch-mode

  publish-nuget:
    name: Publish .NET Package to NuGet
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: core-artifacts
      - name: Build and Publish
        run: |
          cd bindings/csharp/OmniQL
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/win-x64/native
          cp ../../../core-artifacts/core-linux/libomniql.so runtimes/linux-x64/native/
          cp ../../../core-artifacts/core-darwin/libomniql.dylib runtimes/osx-x64/native/
          cp ../../../core-artifacts/core-windows/omniql.dll runtimes/win-x64/native/
          dotnet build -c Release
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
